[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quirkbench"
version = "0.1.0"
description = "Quirkbench: durable, evidence-first controller and target protocol for Linux experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "cryptography>=43", "jsonschema>=4"]

[project.scripts]
quirkbench = "quirkbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

