[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quirkbench"
version = "0.1.0"
description = "Quirkbench: durable, evidence-first controller and target protocol for Linux experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "cryptography>=43", "jsonschema>=4", "setuptools>=68", "wheel", "pyte>=0.8,<0.9"]

[project.scripts]
quirkbench = "quirkbench.cli:main"
quirkbench-worker = "quirkbench.recovery_worker:main"
quirkbench-job-worker = "quirkbench.job_worker:main"
quirkbench-controller-service = "quirkbench.controller_service:main"

[tool.setuptools]
packages = ["quirkbench", "quirkbench.assets", "quirkbench.schemas", "quirkbench.examples", "quirkbench.guide"]

[tool.setuptools.package-dir]
quirkbench = "src/quirkbench"
"quirkbench.assets" = "target-assets"
"quirkbench.schemas" = "schemas"
"quirkbench.examples" = "examples"
"quirkbench.guide" = "docs"

[tool.setuptools.package-data]
quirkbench = ["*.sh", "*.service", "profiles/*.json", "baselines/*.json", "recipes/*.json"]
"quirkbench.assets" = ["*.service", "*.mount", "*.conf", "*.fragment", "*.sh"]
"quirkbench.schemas" = ["*.json"]
"quirkbench.examples" = ["*.json"]
"quirkbench.guide" = ["*.md", "requirements/*.md", "designs/*.md", "mockups/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
