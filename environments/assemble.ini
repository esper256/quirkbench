# Development and agent builder prototype only. Distrobox's generated command
# binds host /dev and uses --privileged; do not run recovery rootfs, image, or
# other storage-sensitive stages in this profile.
[quirkbench-build]
image=localhost/quirkbench-build:local
pull=false
replace=false
init=false
nvidia=false
home="/tmp/quirkbench-build-home"
additional_flags="--cpus=4 --memory=4g --memory-swap=4g"
