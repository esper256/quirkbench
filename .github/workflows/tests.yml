name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QB_PR_HEAD: ${{ github.event.pull_request.head.sha }}
  QB_PR_BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            umask: '022'
          - python-version: '3.13'
            umask: '077'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/software-tests
        with:
          suite: smoke
          python-version: ${{ matrix.python-version }}
          umask: ${{ matrix.umask }}
          timeout: '120'
