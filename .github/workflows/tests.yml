name: tests

on:
  push:
  pull_request:

jobs:
  # Software only. Real composition/image/VM/endurance gates are release-only;
  # never add them to push/PR CI (see docs/testing-policy.md).
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            umask: '022'
          - python-version: '3.13'
            umask: '077'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # A fresh venv prevents runner-global build tools from hiding omissions.
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[test]'
      - run: |
          umask "${{ matrix.umask }}"
          .venv/bin/python -m pytest
