name: tests

on:
  push:
  pull_request:

jobs:
  # Software only. Real composition/image/VM/endurance gates are release-only;
  # never add them to push/PR CI (see docs/testing-policy.md).
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
