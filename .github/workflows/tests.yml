name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Routine smoke only; the complete software matrix is a manual milestone gate.
  # Real composition/image/VM/endurance gates remain release-only.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            umask: '022'
          - python-version: '3.13'
            umask: '077'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # A fresh venv prevents runner-global build tools from hiding omissions.
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[test]'
      - run: |
          umask "${{ matrix.umask }}"
          make smoke
