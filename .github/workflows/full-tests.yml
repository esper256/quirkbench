name: full software tests
run-name: Full software tests — ${{ inputs.milestone }}

# Dispatch on the chosen branch/tag only at a software integration milestone.
# This does not authorize real image, VM or hardware release qualification.
on:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Milestone or broad integration being validated'
        required: true
        type: string

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            umask: '022'
          - python-version: '3.13'
            umask: '077'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[test]'
      - name: Record tested source
        run: git rev-parse HEAD
      - name: Full software suite
        run: |
          umask "${{ matrix.umask }}"
          .venv/bin/python -m pytest tests --durations=25 --junitxml=full-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-results-${{ matrix.python-version }}-${{ matrix.umask }}-${{ github.sha }}
          path: full-results.xml
          if-no-files-found: warn
