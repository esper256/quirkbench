name: full software tests
run-name: Full software tests — ${{ inputs.milestone }}

# Explicit software milestone only; never release/hardware qualification.
on:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Milestone or broad integration being validated'
        required: true
        type: string

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            umask: '022'
          - python-version: '3.13'
            umask: '077'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/software-tests
        with:
          suite: full
          python-version: ${{ matrix.python-version }}
          umask: ${{ matrix.umask }}
          timeout: '2400'
