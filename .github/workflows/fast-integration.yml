name: Fast integration
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: timeout 180s uv run --no-sync pytest -q --durations=10
      - run: uv run --no-sync ruff check src tests development
      - run: uv run --no-sync ruff format --check src tests development
      - run: bash -n dev src/quirkbench/assets/build-recovery.sh src/quirkbench/assets/build-efi.sh src/quirkbench/assets/bazzite/build-root-image.sh src/quirkbench/assets/bazzite/normalize-root.sh development/rsync-image-metadata.sh
